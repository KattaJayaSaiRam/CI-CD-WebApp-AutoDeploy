name: CD to AWS EC2 via rsync

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Deploy via rsync over SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/CI-CD-WebApp-AutoDeploy/'Quiz App'/'Quiz App'

      - name: Restart Docker container on EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
         host: ${{ secrets.EC2_HOST }}
         username: ${{ secrets.EC2_USER }}
         key: ${{ secrets.EC2_SSH_KEY }}
         script: |
          cd /home/ubuntu/CI-CD-WebApp-AutoDeploy/'Quiz App'/'Quiz App'  # adjust folder if needed

          # Stop and remove container if running
          docker stop quizapp || true
          docker rm quizapp || true

          # Remove old image if it exists
          if docker images | grep -q quizapp; then
          docker rmi quizapp || true
          fi

          # Build fresh image with no cache
          docker build --no-cache -t quizapp .

          # Run container
          docker run -d -p 80:80 --name quizapp quizapp

