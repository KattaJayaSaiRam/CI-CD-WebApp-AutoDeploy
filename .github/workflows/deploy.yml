on:
  workflow_dispatch:


jobs:

  deploy:

    name: Deploy only after CI passes
    runs-on: ubuntu-latest
    env:
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Deploy to EC2
        run: echo "Deploying only after CI passes"

      - name: Checkout dev branch
        uses: actions/checkout@v2
        with:
          ref: dev

      - name: Install rsync
        run: sudo apt-get install -y rsync

      - name: Write SSH key to file
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Sync repo to EC2
        run: |
          rsync -avz --delete \
            --exclude='.git*' \
            --exclude='key.pem' \
            -e "ssh -o StrictHostKeyChecking=no -i key.pem" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_IP }}:/home/ubuntu/CI-CD-WebApp-AutoDeploy

      - name: Restart Docker container
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install Docker if missing
            if ! command -v docker &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            # Navigate to app folder
            cd /home/ubuntu/CI-CD-WebApp-AutoDeploy/'Quiz App'

            # Stop and remove old container
            docker stop quizapp || true
            docker rm quizapp || true
            docker rmi quizapp || true

            # Build and run new container
            docker build --no-cache -t quizapp .
            docker run -d -p 80:80 --name quizapp quizapp
