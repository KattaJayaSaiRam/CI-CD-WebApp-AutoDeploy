name: CI Pipeline

on:
  push:
    branches:
      - main
      - staging
      - dev
  pull_request:
    branches:
      - main
      - staging
      - dev

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
    
      - name: List files
        run: ls -l

      - name: Check backup.sh permissions
        run: ls -l .github/QuizApp/backup.sh

      # Week 5: Validate HTML files (recursive)
      - name: Validate HTML files
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy
          find . -name "*.html" -type f -exec tidy -qe {} \; || true

      #Week 5: Lint CSS (recursive)
      - name: Lint CSS
        run: |
          npm install -g stylelint
          stylelint "**/*.css" || true

      #Unit Tests
      - name: Run JavaScript unit tests
        working-directory: Quiz App
        shell: bash
        run: |
          npm install
          chmod +x ./node_modules/.bin/jest
          ./node_modules/.bin/jest

      #Week 5: Lint JavaScript (recursive)
      - name: Lint JavaScript
        run: |
          npm install -g eslint
          eslint "**/*.js" || true

      #Week 5: Run backup script from Week 3
      - name: Run backup script
        run: bash .github/QuizApp/backup.sh

      # Original branch-specific test step
      - name: Run tests for dev
        if: github.ref == 'refs/heads/dev'
        run: echo "Running tests on DEV branch"

      - name: Trigger deploy.yml via REST API
        if: success()
        run: |
         curl -X POST \
           -H "Accept: application/vnd.github+json" \
           -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
           https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
           -d '{"ref":"dev"}'


  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Original branch-specific deploy step
      - name: Deploy from dev
        if: github.ref == 'refs/heads/dev'
        run: echo "Deploying from dev branch"
 
      - name: Trigger EC2 Deployment
        run: echo "Ready to deploy to EC2"


